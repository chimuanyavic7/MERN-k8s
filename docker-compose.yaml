  backend:
    image: chimuanyavic7/mern-backend:v1
    container_name: backend
    ports:
      - "5050:5050"
    environment:
      MONGO_URI: mongodb://mongo:27017/mydatabase  
    depends_on:
      - mongodb
    networks:
      - mern_network


    

 
  frontend:
    image: chimuanyavic7/mern-frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mern_network



 # frontend:
 #   build: ./mern/frontend
 #   ports:
  #    - "80:80"  
  #  networks:
 #     - mern_network
 #   environment:
 #     REACT_APP_API_URL: http://backend:5050 

  mongodb:
    image: mongo:latest  
    ports:
      - "27017:27017"  
    networks:
      - mern_network
    volumes:
      - mongo-data:/data/db  

networks:
  mern_network:
    driver: bridge 

volumes:
  mongo-data:
    driver: local  # Persist MongoDB data locally

